<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eagle X — Lumen Preview</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <main class="home">
    <section class="hero" aria-label="Featured content">
      <div class="hero-art" id="heroArt"></div>
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <h1 id="heroTitle">AerioTV</h1>
        <div class="hero-year" id="heroYear"></div>
        <p id="heroPlot">Your entertainment, in one cinematic home.</p>
        <div class="actions">
          <button class="action primary" id="playBtn">▶ <span>Play</span></button>
          <button class="action secondary">♡ <span>My List</span></button>
        </div>
      </div>
    </section>
    <section class="shelf" id="moviesShelf">
      <h2>Movies</h2><div class="cards" id="movies"></div>
    </section>
    <section class="shelf" id="seriesShelf">
      <h2>TV Shows</h2><div class="cards" id="series"></div>
    </section>
  </main>

  <nav class="top-nav" aria-label="Lumen navigation">
    <button class="nav-btn" data-target="live">▣<span>Live TV</span></button>
    <button class="nav-btn" data-target="movies">◫<span>Movies</span></button>
    <button class="nav-btn" data-target="series">▤<span>Series</span></button>
    <button class="nav-btn" data-target="settings">⚙<span>Settings</span></button>
  </nav>
</div>
<script src="./app.js"></script>
</body>
</html>
