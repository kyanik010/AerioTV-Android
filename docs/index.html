<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eagle X — Preview</title>
<style>
:root{--bg:#080a0f;--surface:#151a23;--elev:#1c222d;--text:#fff;--muted:#a7afbf;--accent:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}.shell{width:min(100%,520px);min-height:100vh;padding:28px 18px 34px;display:flex;flex-direction:column}
.brand{text-align:center;padding:4px 0 28px}.brand img{width:92px;height:92px;object-fit:contain;display:block;margin:0 auto 10px;border-radius:22px}.brand-name{font-size:23px;font-weight:700;letter-spacing:.2px}.brand-sub{font-size:13px;color:var(--muted);margin-top:5px}
.cards{display:flex;flex-direction:column;gap:14px;margin-top:4px}.card{height:76px;border:1px solid rgba(255,255,255,.07);border-radius:24px;background:linear-gradient(145deg,rgba(28,34,45,.98),rgba(21,26,35,.98));display:flex;align-items:center;padding:0 20px;box-shadow:0 10px 28px rgba(0,0,0,.2);transition:.18s;cursor:pointer}.card:active{transform:scale(.985)}.icon{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:21px;margin-left:14px}.copy{flex:1;text-align:right}.ar{font-size:17px;font-weight:650}.en{font-size:11px;color:var(--muted);margin-top:3px}.arrow{font-size:20px;color:var(--muted)}
.note{text-align:center;color:#697386;font-size:11px;margin-top:auto;padding-top:28px}
@media(min-width:700px){.shell{padding-top:48px}}
</style>
</head>
<body>
<main class="shell">
<header class="brand">
<img src="https://raw.githubusercontent.com/kyanik010/AerioTV-Android/feat/lumen-mobile-redesign-from-59d033e/app/src/main/res/drawable-nodpi/eagle_x_logo.jpg" alt="Eagle X">
<div class="brand-name">Eagle X</div><div class="brand-sub">Streaming Experience</div>
</header>
<section class="cards">
<div class="card"><div class="icon">🎬</div><div class="copy"><div class="ar">الأفلام</div><div class="en">Movies</div></div><div class="arrow">‹</div></div>
<div class="card"><div class="icon">📺</div><div class="copy"><div class="ar">المسلسلات</div><div class="en">Series</div></div><div class="arrow">‹</div></div>
<div class="card"><div class="icon">▣</div><div class="copy"><div class="ar">القنوات</div><div class="en">Live TV</div></div><div class="arrow">‹</div></div>
<div class="card"><div class="icon">♡</div><div class="copy"><div class="ar">المفضلة</div><div class="en">Favorites</div></div><div class="arrow">‹</div></div>
<div class="card"><div class="icon">⚙</div><div class="copy"><div class="ar">الإعدادات</div><div class="en">Settings</div></div><div class="arrow">‹</div></div>
</section>
<div class="note">AerioTV · Lumen mobile preview</div>
</main>
</body>
</html>
