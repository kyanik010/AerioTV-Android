name: Apply Home render fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-home-render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Patch Home rendering
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt')
          s = p.read_text(encoding='utf-8')

          pattern = r'(?m)^([ \t]*)MainTabContent\(\n\1    selectedTab = selectedTab,'
          m = re.search(pattern, s)
          if not m:
              raise SystemExit('MainTabContent call anchor not found')
          indent = m.group(1)
          replacement = (
              f'{indent}if (selectedTab == AppTab.Home) {{\n'
              f'{indent}    EagleXHomeNavigation(\n'
              f'{indent}        onSelect = {{ selectedTab = it; initialTabApplied = true }},\n'
              f'{indent}        modifier = Modifier.fillMaxSize(),\n'
              f'{indent}    )\n'
              f'{indent}}} else {{\n'
              f'{indent}    MainTabContent(\n'
              f'{indent}        selectedTab = selectedTab,'
          )
          s = s[:m.start()] + replacement + s[m.end():]

          end_pattern = r'(?m)^([ \t]*)visited = visitedTabs,\n\1modifier = Modifier\.fillMaxSize\(\),\n\1\)\n(\1// No "Syncing" pill on phone:)'
          e = re.search(end_pattern, s)
          if not e:
              raise SystemExit('MainTabContent end anchor not found')
          ei = e.group(1)
          end_replacement = (
              f'{ei}visited = visitedTabs,\n'
              f'{ei}modifier = Modifier.fillMaxSize(),\n'
              f'{ei})\n'
              f'{ei}}}\n'
              f'{e.group(2)}'
          )
          s = s[:e.start()] + end_replacement + s[e.end():]
          p.write_text(s, encoding='utf-8')

      - name: Verify source shape
        shell: bash
        run: |
          grep -n -A8 -B2 'if (selectedTab == AppTab.Home)' app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
          grep -n -A4 'EagleXHomeNavigation(' app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt').read_text()
          assert s.count('if (selectedTab == AppTab.Home)') == 1
          assert s.count('private fun EagleXHomeNavigation(') == 1
          print('Home render wiring verified')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt .github/workflows/fix-home-render.yml
          git rm .github/workflows/fix-home-render.yml
          git commit -m 'fix: render Eagle X Home content'
          git push origin HEAD:main
