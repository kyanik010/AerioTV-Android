name: Fix Home Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply exact Home render fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt')
          s = p.read_text()
          if 'if (selectedTab == AppTab.Home) {' not in s:
              marker = '''    Box(modifier = modifier) {\n        val render: @Composable (AppTab) -> Unit = { tab -> when (tab) {'''
              replacement = '''    Box(modifier = modifier) {\n        if (selectedTab == AppTab.Home) {\n            EagleXHomeNavigation(\n                onSelect = onSelectTab,\n                modifier = Modifier.fillMaxSize(),\n            )\n        } else {\n        val render: @Composable (AppTab) -> Unit = { tab -> when (tab) {'''
              if s.count(marker) != 1:
                  raise SystemExit(f'Expected exactly one MainTabContent marker, found {s.count(marker)}')
              s = s.replace(marker, replacement, 1)
              tail = '''        keepAliveTabs.forEach { tab ->\n            val active = tab == selectedTab\n            androidx.compose.runtime.key(tab) {\n                CompositionLocalProvider(LocalTabIsActive provides active) {\n                    Box(if (active) Modifier.fillMaxSize() else Modifier.keepAliveHidden()) { render(tab) }\n                }\n            }\n        }\n    }\n}'''
              replacement_tail = '''        keepAliveTabs.forEach { tab ->\n            val active = tab == selectedTab\n            androidx.compose.runtime.key(tab) {\n                CompositionLocalProvider(LocalTabIsActive provides active) {\n                    Box(if (active) Modifier.fillMaxSize() else Modifier.keepAliveHidden()) { render(tab) }\n                }\n            }\n        }\n        }\n    }\n}'''
              if s.count(tail) != 1:
                  raise SystemExit(f'Expected exactly one MainTabContent tail, found {s.count(tail)}')
              s = s.replace(tail, replacement_tail, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
          git diff --cached --quiet || git commit -m 'fix: render Eagle X Home content'
          git push origin HEAD:main
      - name: Build debug APK from fixed source
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGithubDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/github/debug/app-github-debug.apk
          sha256sum app/build/outputs/apk/github/debug/app-github-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-Github-debug-fixed
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
