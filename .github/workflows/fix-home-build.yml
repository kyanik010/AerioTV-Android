name: Fix Home Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply remaining compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt')
          s = p.read_text()
          if 'return@Scaffold' not in s:
              raise SystemExit('Expected return@Scaffold was not found')
          s = s.replace('return@Scaffold', 'return@Box', 1)
          p.write_text(s)
          PY
          git diff --check
          ! grep -n 'return@Scaffold' app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
          git commit -m 'fix: correct remaining Home scaffold return'
          git push origin HEAD:main
      - name: Build debug APK from fixed source
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGithubDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/github/debug/app-github-debug.apk
          sha256sum app/build/outputs/apk/github/debug/app-github-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-Github-debug-fixed
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
