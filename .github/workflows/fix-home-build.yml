name: Fix Home Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply exact Home and compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt')
          s = p.read_text()

          old_box = '            Box(modifier = Modifier.fillMaxSize()) {\n'
          old_return = '        return@Box\n'
          old_cast_align = '                    .navigationBarsPadding()\n                    .padding(bottom = 10.dp),\n                horizontalAlignment = Alignment.CenterHorizontally,\n'
          if s.count(old_box) != 1:
              raise SystemExit(f'Expected exactly one TV shell Box, found {s.count(old_box)}')
          if s.count(old_return) != 1:
              raise SystemExit(f'Expected exactly one return@Box, found {s.count(old_return)}')
          if s.count(old_cast_align) != 1:
              raise SystemExit(f'Expected exactly one cast Column alignment block, found {s.count(old_cast_align)}')

          s = s.replace(old_box, '            tvShellBox@Box(modifier = Modifier.fillMaxSize()) {', 1)
          s = s.replace(old_return, '        return@tvShellBox\n', 1)
          s = s.replace(old_cast_align, '                    .navigationBarsPadding()\n                    .padding(bottom = 10.dp),\n', 1)

          marker = '''    Box(modifier = modifier) {\n        val render: @Composable (AppTab) -> Unit = { tab -> when (tab) {'''
          home = '''    Box(modifier = modifier) {\n        if (selectedTab == AppTab.Home) {\n            EagleXHomeNavigation(\n                onSelect = onSelectTab,\n                modifier = Modifier.fillMaxSize(),\n            )\n        } else {\n        val render: @Composable (AppTab) -> Unit = { tab -> when (tab) {'''
          if s.count(marker) == 1:
              s = s.replace(marker, home, 1)
          elif 'if (selectedTab == AppTab.Home) {' not in s:
              raise SystemExit('MainTabContent Home insertion marker not found')

          tail = '''        keepAliveTabs.forEach { tab ->\n            val active = tab == selectedTab\n            androidx.compose.runtime.key(tab) {\n                CompositionLocalProvider(LocalTabIsActive provides active) {\n                    Box(if (active) Modifier.fillMaxSize() else Modifier.keepAliveHidden()) { render(tab) }\n                }\n            }\n        }\n    }\n}'''
          if s.count(tail) == 1 and 'if (selectedTab == AppTab.Home)' in s and '\n        }\n    }\n}\n\n/**\n * 10-foot top navigation' not in s:
              s = s.replace(tail, tail.replace('\n    }\n}', '\n        }\n    }\n}'), 1)
          elif 'if (selectedTab == AppTab.Home)' in s:
              # Already inserted; do not mutate the body again.
              pass
          else:
              raise SystemExit('MainTabContent tail marker not found')

          p.write_text(s)
          PY
          git diff --check
          ! grep -n 'return@Scaffold\|return@Box' app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
          git diff --cached --quiet || git commit -m 'fix: render Eagle X Home and correct compile labels'
          git push origin HEAD:main
      - name: Build debug APK from fixed source
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGithubDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/github/debug/app-github-debug.apk
          sha256sum app/build/outputs/apk/github/debug/app-github-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-Github-debug-fixed
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
