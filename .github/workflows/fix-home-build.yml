name: Fix Home Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply exact compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt')
          s = p.read_text()
          old_box = '            Box(modifier = Modifier.fillMaxSize()) {\n'
          old_return = '        return@Box\n'
          old_cast_align = '                    .navigationBarsPadding()\n                    .padding(bottom = 10.dp),\n                horizontalAlignment = Alignment.CenterHorizontally,\n'
          if s.count(old_box) != 1:
              raise SystemExit(f'Expected exactly one TV shell Box, found {s.count(old_box)}')
          if s.count(old_return) != 1:
              raise SystemExit(f'Expected exactly one return@Box, found {s.count(old_return)}')
          if s.count(old_cast_align) != 1:
              raise SystemExit(f'Expected exactly one cast Column alignment block, found {s.count(old_cast_align)}')
          s = s.replace(old_box, '            tvShellBox@Box(modifier = Modifier.fillMaxSize()) {', 1)
          s = s.replace(old_return, '        return@tvShellBox\n', 1)
          s = s.replace(old_cast_align, '                    .navigationBarsPadding()\n                    .padding(bottom = 10.dp),\n', 1)
          p.write_text(s)
          PY
          git diff --check
          ! grep -n 'return@Scaffold\|return@Box' app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aeriotv/android/feature/main/MainScaffold.kt
          git commit -m 'fix: correct Home shell label and cast column alignment'
          git push origin HEAD:main
      - name: Build debug APK from fixed source
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGithubDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/github/debug/app-github-debug.apk
          sha256sum app/build/outputs/apk/github/debug/app-github-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-Github-debug-fixed
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
