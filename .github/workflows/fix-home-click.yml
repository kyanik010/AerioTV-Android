name: Fix Home Click Targets

on:
  push:
    branches:
      - ui/reference-home-2026-09-26

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/reference-home-2026-09-26
          fetch-depth: 0
      - name: Patch Home interaction modifiers
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/aeriotv/android/feature/main/AerioHomeScreen.kt")
          s = p.read_text()
          old = """                    .focusRequester(requesters[index])\n                    .focusProperties { down = downTarget }\n                    .focusable()"""
          new = """                    .focusRequester(requesters[index])\n                    .focusProperties { down = downTarget }\n                    .clickable { onSelectTab(tab) }\n                    .focusable()"""
          if old not in s:
              raise SystemExit("nav interaction marker not found")
          s = s.replace(old, new, 1)
          s = s.replace("                androidx.compose.foundation.clickable(onClick = { onSelectTab(tab) })\n", "", 1)
          old2 = """                    .onFocusChanged { if (it.isFocused) onSelected((selectedIndex + offset).floorMod(itemCount)) }\n                    .focusable()"""
          new2 = """                    .onFocusChanged { if (it.isFocused) onSelected((selectedIndex + offset).floorMod(itemCount)) }\n                    .clickable { onPlay(item) }\n                    .focusable()"""
          if old2 not in s:
              raise SystemExit("poster interaction marker not found")
          s = s.replace(old2, new2, 1)
          s = s.replace("                if (distance == 0 && selectedIndex >= 0) {\n                    androidx.compose.foundation.clickable(onClick = { onPlay(item) })\n                }\n", "", 1)
          p.write_text(s)
          wf = Path(".github/workflows/fix-home-click.yml")
          wf.unlink()
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aeriotv/android/feature/main/AerioHomeScreen.kt .github/workflows/fix-home-click.yml
          git commit -m "fix: make reference home remote targets actionable"
          git push origin HEAD:ui/reference-home-2026-09-26
