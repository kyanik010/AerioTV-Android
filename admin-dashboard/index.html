<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101d">
<title>Eagle X Control — لوحة الإدارة</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--panel:#0d1929;--line:#20344b;--text:#edf5ff;--muted:#9badc3;--accent:#16c7e8;--danger:#ff637b;--ok:#25d995}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#102b40 0,transparent 36%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;background:var(--accent);color:#03121a;font-weight:800}button.secondary{background:#18283b;border:1px solid #2b4057;color:var(--text)}button.danger{background:#4b1d2a;border:1px solid #803246;color:#ffdce2}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1120px;margin:auto;padding:22px 14px 48px}.panel{background:linear-gradient(145deg,#0d1929,#091321);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 14px 40px #0003}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.error{color:#ff9aa9}.success{color:#75efbb}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{font-size:24px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{border:1px solid var(--line);border-radius:14px;padding:14px;background:#091321}.stat b{display:block;font-size:25px;margin-top:5px}.field{display:grid;gap:6px;margin:10px 0}.field label{color:var(--muted);font-size:13px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #2a4058;border-radius:10px;background:#07111e;color:var(--text);min-height:43px}textarea{min-height:75px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{outline:2px solid var(--accent);background:#15364a;color:#eaffff}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.section-title h2{font-size:19px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid #1e3044;vertical-align:top}th{color:var(--muted);font-size:12px;font-weight:700}td{font-size:13px}.badge{display:inline-block;border:1px solid #344a61;border-radius:99px;padding:4px 8px;background:#142538;font-size:12px}.badge.active{color:#79f0ba;border-color:#1c674b}.badge.expired,.badge.revoked{color:#ff9aaa;border-color:#713345}.badge.suspended{color:#ffd080;border-color:#725a2d}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.notice{padding:11px;border-radius:10px;background:#091321;border:1px solid var(--line);color:var(--muted);font-size:13px;margin:12px 0}.statusline{min-height:20px;margin-top:8px;font-size:13px}.item-card{border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:9px;background:#091321}.item-card h3{font-size:15px;margin:0 0 8px;word-break:break-word}@media(max-width:650px){.wrap{padding:12px 9px 30px}.panel{padding:13px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<section id="loginPanel" class="panel" style="max-width:440px;margin:8vh auto">
  <h1>Eagle X Control</h1><p class="muted">تسجيل دخول المدير</p>
  <form id="loginForm">
    <div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button id="loginBtn" type="submit" style="width:100%">تسجيل الدخول</button>
  </form><div id="loginMsg" class="statusline error" role="status"></div>
  <div class="notice">تُستخدم مصادقة Supabase والتحقق من صلاحية المدير قبل الوصول إلى البيانات.</div>
</section>
<section id="app" class="hidden">
  <header class="panel top"><div><h1>Eagle X Control</h1><div class="muted">لوحة إدارة الأجهزة والاشتراكات</div><div id="who" class="muted"></div></div><div class="row" style="flex:0 0 auto"><button class="secondary" id="refreshBtn">تحديث البيانات</button><button class="danger" id="logoutBtn">تسجيل الخروج</button></div></header>
  <div class="stats">
    <div class="stat"><span class="muted">إجمالي الأجهزة</span><b id="totalDevices">—</b></div>
    <div class="stat"><span class="muted">الأجهزة النشطة</span><b id="activeDevices">—</b></div>
    <div class="stat"><span class="muted">الاشتراكات</span><b id="totalSubs">—</b></div>
  </div>
  <div class="tabs" style="margin-top:14px">
    <button class="active" data-tab="devices">الأجهزة</button><button class="secondary" data-tab="subscriptions">الاشتراكات</button><button class="secondary" data-tab="audit">سجل العمليات</button>
  </div>
  <section id="devicesTab" class="panel">
    <div class="section-title"><h2>الأجهزة</h2><button id="toggleDeviceForm" class="secondary">＋ إضافة جهاز</button></div>
    <div id="deviceFormBox" class="notice hidden">
      <h3>إضافة جهاز جديد</h3><form id="deviceForm">
        <div class="grid">
          <div class="field"><label>معرّف الجهاز</label><input name="device_identifier" required minlength="3" maxlength="256" placeholder="MAC / Device ID"></div>
          <div class="field"><label>رمز التفعيل</label><input name="activation_code" required minlength="6" maxlength="256"></div>
          <div class="field"><label>اسم الجهاز (اختياري)</label><input name="device_name"></div>
          <div class="field"><label>الحالة</label><select name="status"><option value="pending">بانتظار التفعيل</option><option value="active">نشط</option><option value="suspended">موقوف</option></select></div>
          <div class="field"><label>تاريخ الانتهاء (اختياري)</label><input name="expires_at" type="datetime-local"></div>
          <div class="field"><label>ملاحظات (اختياري)</label><input name="notes"></div>
        </div><div class="row"><button type="submit">حفظ الجهاز</button><button type="button" class="secondary" id="cancelDeviceForm">إلغاء</button></div>
      </form><div id="deviceFormMsg" class="statusline"></div>
    </div>
    <div class="row"><div class="field"><label>بحث</label><input id="deviceSearch" placeholder="ابحث بالمعرّف أو الاسم"></div><div class="field"><label>تصفية الحالة</label><select id="deviceFilter"><option value="all">كل الحالات</option><option value="pending">بانتظار التفعيل</option><option value="active">نشط</option><option value="suspended">موقوف</option><option value="revoked">ملغي</option><option value="expired">منتهي</option></select></div></div>
    <div id="devicesMsg" class="statusline muted">جارٍ التحميل…</div><div id="devicesList" class="table-wrap"></div>
  </section>
  <section id="subscriptionsTab" class="panel hidden">
    <div class="section-title"><h2>الاشتراكات</h2><button id="toggleSubForm" class="secondary">＋ إضافة اشتراك</button></div>
    <div id="subFormBox" class="notice hidden"><form id="subForm"><div class="grid">
      <div class="field"><label>اسم الاشتراك</label><input name="name" required></div>
      <div class="field"><label>رمز الخطة</label><input name="plan_code" value="standard"></div>
      <div class="field"><label>الحالة</label><select name="status"><option value="active">نشط</option><option value="paused">متوقف مؤقتًا</option><option value="expired">منتهي</option><option value="cancelled">ملغي</option></select></div>
      <div class="field"><label>الحد الأقصى للأجهزة</label><input name="max_devices" type="number" min="1" max="100" value="1" required></div>
      <div class="field"><label>بداية الاشتراك</label><input name="starts_at" type="datetime-local"></div>
      <div class="field"><label>تاريخ الانتهاء</label><input name="expires_at" type="datetime-local"></div>
      <div class="field"><label>ملاحظات</label><input name="notes"></div>
    </div><div class="row"><button type="submit">حفظ الاشتراك</button><button type="button" class="secondary" id="cancelSubForm">إلغاء</button></div></form><div id="subFormMsg" class="statusline"></div></div>
    <div id="subsMsg" class="statusline muted">جارٍ التحميل…</div><div id="subsList" class="table-wrap"></div>
  </section>
  <section id="auditTab" class="panel hidden"><div class="section-title"><h2>سجل العمليات</h2><button class="secondary" id="refreshAudit">تحديث السجل</button></div><div id="auditMsg" class="statusline muted"></div><div id="auditList" class="table-wrap"></div></section>
  <div id="globalMsg" class="statusline" role="status"></div>
</section>
</div>
<script>
'use strict';
const URL='https://gyadzfbfxayifwrpevuq.supabase.co';
const KEY='sb_publishable_sOK57WGfBcTE75ArdZSmiQ_htG1tn-H';
const API=URL+'/functions/v1/admin-api';
const $=id=>document.getElementById(id);
let session=null,devices=[],subscriptions=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString()};
const isoFromLocal=v=>v?new Date(v).toISOString():null;
const labelStatus=s=>({pending:'بانتظار التفعيل',active:'نشط',suspended:'موقوف',revoked:'ملغي',expired:'منتهي',paused:'متوقف مؤقتًا',cancelled:'ملغي'}[s]||s||'—');
function showLogin(message=''){ $('loginPanel').classList.remove('hidden');$('app').classList.add('hidden');$('loginMsg').textContent=message; }
function showApp(){ $('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session?.user?.email||''; }
async function login(email,password){
 const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(j.error_description||j.msg||j.message||'تعذر تسجيل الدخول');
 session={access_token:j.access_token,refresh_token:j.refresh_token,user:j.user};
 localStorage.setItem('eagle_x_admin_session',JSON.stringify(session));
}
async function refreshSession(){
 if(!session?.refresh_token)return false;
 const r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({refresh_token:session.refresh_token})});
 const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token)return false;
 session={access_token:j.access_token,refresh_token:j.refresh_token,user:j.user||session.user};localStorage.setItem('eagle_x_admin_session',JSON.stringify(session));return true;
}
async function api(path,method='GET',body){
 if(!session?.access_token)throw Error('انتهت الجلسة؛ سجّل الدخول مجددًا.');
 const opts={method,headers:{'apikey':KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'}};
 if(body!==undefined)opts.body=JSON.stringify(body);
 let r=await fetch(API+'/'+path.replace(/^\/+/,''),opts);
 if(r.status===401&&await refreshSession()){opts.headers.Authorization='Bearer '+session.access_token;r=await fetch(API+'/'+path.replace(/^\/+/,''),opts)}
 const j=await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401){logout(false)}throw Error(j.error||j.message||('فشل الطلب ('+r.status+')'))}
 return j;
}
function logout(show=true){localStorage.removeItem('eagle_x_admin_session');session=null;if(show)showLogin();else showLogin('انتهت الجلسة، سجّل الدخول مرة أخرى.')}
function setMsg(id,msg,kind='muted'){const e=$(id);if(e){e.className='statusline '+kind;e.textContent=msg||''}}
function statusBadge(s){return '<span class="badge '+esc(s)+'">'+esc(labelStatus(s))+'</span>'}
function switchTab(tab){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.classList.toggle('secondary',b.dataset.tab!==tab)});['devices','subscriptions','audit'].forEach(t=>$(t+'Tab').classList.toggle('hidden',t!==tab));if(tab==='audit')loadAudit()}
function renderDevices(){
 const q=$('deviceSearch').value.trim().toLowerCase(),f=$('deviceFilter').value;
 const rows=devices.filter(d=>(f==='all'||d.status===f)&&(!q||(d.device_identifier+' '+(d.device_name||'')).toLowerCase().includes(q)));
 $('totalDevices').textContent=devices.length;$('activeDevices').textContent=devices.filter(d=>d.status==='active').length;
 if(!rows.length){$('devicesList').innerHTML='<div class="notice">لا توجد أجهزة مطابقة.</div>';return}
 $('devicesList').innerHTML='<table><thead><tr><th>الجهاز</th><th>الحالة</th><th>الانتهاء</th><th>آخر اتصال</th><th>الإجراءات</th></tr></thead><tbody>'+rows.map(d=>'<tr><td><b>'+esc(d.device_name||d.device_identifier)+'</b><div class="muted" dir="ltr">'+esc(d.device_identifier)+'</div><div class="muted">'+esc(d.notes||'')+'</div></td><td>'+statusBadge(d.status)+'</td><td>'+esc(dt(d.expires_at))+'</td><td>'+esc(dt(d.last_seen_at))+'</td><td><div class="actions"><select aria-label="حالة الجهاز" id="status-'+esc(d.id)+'">'+['pending','active','suspended','revoked','expired'].map(s=>'<option value="'+s+'" '+(d.status===s?'selected':'')+'>'+esc(labelStatus(s))+'</option>').join('')+'</select><button onclick="saveDevice(\''+esc(d.id)+'\')">حفظ</button><button class="danger" onclick="deleteDevice(\''+esc(d.id)+'\',\''+esc(d.device_identifier)+'\')">حذف</button></div></td></tr>').join('')+'</tbody></table>';
}
async function loadDevices(){
 setMsg('devicesMsg','جارٍ تحميل الأجهزة…');
 try{const j=await api('devices');devices=Array.isArray(j.data)?j.data:[];renderDevices();setMsg('devicesMsg','تم تحميل '+devices.length+' جهاز.','success');$('totalDevices').textContent=devices.length;$('activeDevices').textContent=devices.filter(d=>d.status==='active').length}
 catch(e){setMsg('devicesMsg',e.message,'error');$('devicesList').innerHTML=''}
}
async function saveDevice(id){
 const status=$('status-'+id)?.value;if(!status)return;
 try{await api('devices/'+encodeURIComponent(id),'PATCH',{status});setMsg('globalMsg','تم تحديث حالة الجهاز.','success');await loadDevices();await loadAudit()}
 catch(e){setMsg('globalMsg',e.message,'error')}
}
async function deleteDevice(id,name){
 if(!confirm('هل تريد حذف الجهاز '+name+' نهائيًا؟'))return;
 try{await api('devices/'+encodeURIComponent(id),'DELETE');setMsg('globalMsg','تم حذف الجهاز.','success');await loadDevices();await loadAudit()}
 catch(e){setMsg('globalMsg',e.message,'error')}
}
async function createDevice(ev){
 ev.preventDefault();const f=new FormData(ev.currentTarget),body=Object.fromEntries(f.entries());
 body.device_identifier=String(body.device_identifier||'').trim().toUpperCase();body.activation_code=String(body.activation_code||'').trim();
 body.expires_at=isoFromLocal(body.expires_at);body.device_name=body.device_name||null;body.notes=body.notes||null;
 setMsg('deviceFormMsg','جارٍ الحفظ…');
 try{await api('devices','POST',body);ev.currentTarget.reset();$('deviceFormBox').classList.add('hidden');setMsg('deviceFormMsg','');setMsg('globalMsg','تمت إضافة الجهاز بنجاح.','success');await loadDevices();await loadAudit()}
 catch(e){setMsg('deviceFormMsg',e.message,'error')}
}
function renderSubs(){
 $('totalSubs').textContent=subscriptions.length;
 if(!subscriptions.length){$('subsList').innerHTML='<div class="notice">لا توجد اشتراكات.</div>';return}
 $('subsList').innerHTML='<table><thead><tr><th>الاشتراك</th><th>الحالة</th><th>الأجهزة</th><th>الانتهاء</th><th>الإجراءات</th></tr></thead><tbody>'+subscriptions.map(s=>'<tr><td><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.plan_code)+'</div><div class="muted">'+esc(s.notes||'')+'</div></td><td>'+statusBadge(s.status)+'</td><td>'+esc(s.max_devices)+'</td><td>'+esc(dt(s.expires_at))+'</td><td><div class="actions"><select id="substatus-'+esc(s.id)+'" aria-label="حالة الاشتراك">'+['active','paused','expired','cancelled'].map(v=>'<option value="'+v+'" '+(s.status===v?'selected':'')+'>'+esc(labelStatus(v))+'</option>').join('')+'</select><button onclick="saveSub(\''+esc(s.id)+'\')">حفظ</button><button class="danger" onclick="deleteSub(\''+esc(s.id)+'\',\''+esc(s.name)+'\')">حذف</button></div></td></tr>').join('')+'</tbody></table>';
}
async function loadSubscriptions(){
 setMsg('subsMsg','جارٍ تحميل الاشتراكات…');
 try{const j=await api('subscriptions');subscriptions=Array.isArray(j.data)?j.data:[];renderSubs();setMsg('subsMsg','تم تحميل '+subscriptions.length+' اشتراك.','success')}
 catch(e){setMsg('subsMsg',e.message,'error');$('subsList').innerHTML=''}
}
async function createSub(ev){
 ev.preventDefault();const f=new FormData(ev.currentTarget),body=Object.fromEntries(f.entries());
 body.max_devices=Number(body.max_devices);body.starts_at=isoFromLocal(body.starts_at);body.expires_at=isoFromLocal(body.expires_at);body.notes=body.notes||null;
 setMsg('subFormMsg','جارٍ الحفظ…');
 try{await api('subscriptions','POST',body);ev.currentTarget.reset();ev.currentTarget.elements.plan_code.value='standard';ev.currentTarget.elements.max_devices.value='1';$('subFormBox').classList.add('hidden');setMsg('subFormMsg','');await loadSubscriptions();await loadAudit();setMsg('globalMsg','تمت إضافة الاشتراك.','success')}
 catch(e){setMsg('subFormMsg',e.message,'error')}
}
async function saveSub(id){
 const status=$('substatus-'+id)?.value;if(!status)return;
 try{await api('subscriptions/'+encodeURIComponent(id),'PATCH',{status});setMsg('globalMsg','تم تحديث الاشتراك.','success');await loadSubscriptions();await loadAudit()}
 catch(e){setMsg('globalMsg',e.message,'error')}
}
async function deleteSub(id,name){
 if(!confirm('حذف الاشتراك '+name+'؟ قد يرفض النظام الحذف إذا كانت هناك أجهزة مرتبطة به.'))return;
 try{await api('subscriptions/'+encodeURIComponent(id),'DELETE');setMsg('globalMsg','تم حذف الاشتراك.','success');await loadSubscriptions();await loadAudit()}
 catch(e){setMsg('globalMsg',e.message,'error')}
}
async function loadAudit(){
 setMsg('auditMsg','جارٍ تحميل سجل العمليات…');
 try{const j=await api('audit-logs');const rows=Array.isArray(j.data)?j.data:[];$('auditList').innerHTML=rows.length?'<table><thead><tr><th>الوقت</th><th>المنفذ</th><th>العملية</th><th>النوع</th><th>التفاصيل</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(dt(x.created_at))+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity_type)+'</td><td><code>'+esc(JSON.stringify(x.details||{}))+'</code></td></tr>').join('')+'</tbody></table>':'<div class="notice">لا توجد عمليات مسجلة.</div>';setMsg('auditMsg','آخر '+rows.length+' عملية.','success')}
 catch(e){setMsg('auditMsg',e.message,'error')}
}
async function loadAll(){await Promise.all([loadDevices(),loadSubscriptions()]);}
$('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();$('loginBtn').disabled=true;setMsg('loginMsg','جارٍ تسجيل الدخول…');try{await login($('email').value.trim(),$('password').value);$('password').value='';showApp();await loadAll();}catch(e){setMsg('loginMsg',e.message,'error')}finally{$('loginBtn').disabled=false}});
$('logoutBtn').addEventListener('click',()=>logout());$('refreshBtn').addEventListener('click',loadAll);$('refreshAudit').addEventListener('click',loadAudit);
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('toggleDeviceForm').addEventListener('click',()=>$('deviceFormBox').classList.toggle('hidden'));$('cancelDeviceForm').addEventListener('click',()=>$('deviceFormBox').classList.add('hidden'));$('deviceForm').addEventListener('submit',createDevice);
$('toggleSubForm').addEventListener('click',()=>$('subFormBox').classList.toggle('hidden'));$('cancelSubForm').addEventListener('click',()=>$('subFormBox').classList.add('hidden'));$('subForm').addEventListener('submit',createSub);
$('deviceSearch').addEventListener('input',renderDevices);$('deviceFilter').addEventListener('change',renderDevices);
(async function boot(){try{const raw=localStorage.getItem('eagle_x_admin_session');if(raw){session=JSON.parse(raw);if(session?.access_token){showApp();await loadAll();return}}}catch(e){}showLogin()})();
</script>
</body>
</html>
