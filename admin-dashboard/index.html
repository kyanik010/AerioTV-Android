<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eagle X2 Control — إدارة الأجهزة</title>
<style>*{box-sizing:border-box}.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0 0 22px;padding:4px 0 2px}.brand img{width:96px;height:96px;object-fit:contain;border-radius:18px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.28))}.brand-name{margin-top:8px;font-size:20px;font-weight:850;letter-spacing:.3px;color:#f5f7fb}.brand-sub{margin-top:3px;color:#8f9aaa;font-size:12px}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% 0%,#172238 0,#080a0f 38%,#07090d 100%);color:#fff;margin:0;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:20px 14px 40px}.card{background:linear-gradient(145deg,rgba(19,25,36,.96),rgba(12,16,23,.96));border:1px solid #263142;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 14px 40px rgba(0,0,0,.18)}h1,h2,h3{margin:0}.muted{color:#8f9aaa;font-size:13px}.error{color:#ff9b9b}input,select,button{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #303b49;background:#0b1017;color:#fff;min-height:44px}button{cursor:pointer;background:#3567f5;border:0;font-weight:750}button.secondary{background:#1a212c}button.danger{background:#7e2936}button.success{background:#218653}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.header{display:flex;align-items:center;justify-content:space-between;gap:14px}.header button{width:auto;min-width:110px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}.stat{background:linear-gradient(145deg,#111925,#0b1017);border:1px solid #283446;border-radius:18px;padding:15px 10px;text-align:right;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;inset:auto -25px -35px auto;width:80px;height:80px;background:#3567f5;opacity:.08;border-radius:50%}.stat b{display:block;font-size:28px;margin-top:7px;direction:ltr;text-align:right}.section{margin-top:18px;padding-top:18px;border-top:1px solid #252e3a}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section-head h2{font-size:20px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 150px 180px;gap:9px}.toolbar input,.toolbar select{background:#0a0f16;border-color:#293547}.toolbar-actions{display:flex;gap:8px;margin-top:9px}.toolbar-actions>*{flex:1}.admin-actions{margin-top:9px}.admin-actions button{width:auto}.device{background:linear-gradient(145deg,#101722,#0b1017);border:1px solid #273447;border-radius:20px;margin-top:11px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14)}.device-top{padding:17px 18px}.device-title{display:flex;justify-content:space-between;gap:10px}.device-id{font-weight:850;font-size:16px;direction:ltr;text-align:right;word-break:break-all}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#252d38;font-size:12px;font-weight:800}.badge.active{background:#174f38}.badge.suspended{background:#642732}.badge.expired{background:#5b4920}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.meta-item{background:#0c121a;border:1px solid #202b39;border-radius:13px;padding:10px}.meta-item span{display:block;color:#8f9aaa;font-size:11px;margin-bottom:3px}.meta-item b{font-size:13px;word-break:break-word}.device-toggle{border-top:1px solid #252e3a;padding:11px 14px;background:rgba(16,21,29,.72)}details summary{cursor:pointer;list-style:none;font-weight:700;color:#dfe6ef}details summary::-webkit-details-marker{display:none}.details-body{padding:0 0 4px;border-top:1px solid #252e3a;margin-top:10px}.subbox{padding:14px;border:1px solid #252e3a;border-radius:14px;margin-top:12px;background:#10151d}.subbox h3{font-size:14px;margin-bottom:10px}.field{display:grid;gap:6px;margin-top:9px}.field label{font-size:12px;color:#8f9aaa}.secret{direction:ltr;text-align:left}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.pager{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid #202a37}.pager button{width:auto;min-width:100px}.pager span{flex:1;text-align:center;color:#8f9aaa}@media(max-width:800px){.wrap{padding:12px 10px 30px}.card{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:first-child{grid-column:span 2}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:span 2}.meta{grid-template-columns:1fr 1fr}}@media(max-width:430px){.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.meta,.actions{grid-template-columns:1fr}.device-title{display:block}}</style>
</head>
<body><div class="wrap">
<div class="card" id="login"><h1>Eagle X2 Control</h1><p class="muted">لوحة إدارة الأجهزة والتجارب والاشتراكات</p><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn" type="button">تسجيل الدخول</button><div id="loginMsg" class="error"></div></div>
<div class="card" id="app" style="display:none"><div class="brand"><img src="https://raw.githubusercontent.com/kyanik010/AerioTV-Android/4407c1aec6d365eb6f9d48bd2a2559c931477cbf/app/src/main/res/drawable-nodpi/eagle_x_logo.jpg" alt="Eagle X"><div class="brand-name">Eagle X</div></div><div class="header"><div><h1>إدارة الأجهزة</h1><div id="who" class="muted"></div></div><button class="secondary" onclick="logout()">تسجيل الخروج</button></div>
<div class="stats"><div class="stat"><span class="muted">إجمالي الأجهزة</span><b id="total">0</b></div><div class="stat"><span class="muted">التجارب</span><b id="trials">0</b></div><div class="stat"><span class="muted">الاشتراكات النشطة</span><b id="active">0</b></div><div class="stat"><span class="muted">المنتهية</span><b id="expired">0</b></div><div class="stat"><span class="muted">الموقوفة</span><b id="suspended">0</b></div></div>
<div class="section"><div class="section-head"><h2>الأجهزة</h2><div class="muted" id="listInfo"></div></div><div class="toolbar"><input id="q" placeholder="🔎 Device ID أو Username أو Host" autocomplete="off" onkeydown="if(event.key==='Enter')searchDevice()"><select id="filter" onchange="loadDevices(0)"><option value="all">كل الأجهزة</option><option value="trial">تجارب</option><option value="active">نشطة</option><option value="expired">منتهية</option><option value="suspended">موقوفة</option></select><select id="sort" onchange="loadDevices(0)"><option value="last_seen">آخر اتصال</option><option value="created">الأحدث تسجيلًا</option><option value="expires">الأقرب انتهاءً</option></select></div><div class="toolbar-actions"><button class="secondary" onclick="searchDevice()">بحث</button><button class="secondary" onclick="loadAll()">تحديث</button></div><div class="admin-actions"><button class="danger" onclick="deleteAllDevices()">حذف جميع الأجهزة</button></div><div id="results"></div><div class="pager"><button class="secondary" id="prevBtn" onclick="changePage(-1)">السابق</button><span id="pageInfo">الصفحة 1</span><button class="secondary" id="nextBtn" onclick="changePage(1)">التالي</button></div></div></div></div>
<script>
const URL='https://quaftlmuobshbnlhctmf.supabase.co',KEY='sb_publishable_6mdnO-ezptIZzRKNfEbzaA_e9B-ulL5',API=URL+'/functions/v1/admin-control';let session=null,currentPage=0,totalRows=0;const PAGE_SIZE=50,$=id=>document.getElementById(id);window.onerror=m=>$('loginMsg').textContent='خطأ في الصفحة: '+m;
async function boot(){try{const raw=localStorage.getItem('aeriotv_admin_session');if(raw){session=JSON.parse(raw);if(session && session.access_token){showApp();loadAll();return}}showLogin()}catch(e){localStorage.removeItem('aeriotv_admin_session');showLogin()}}
function showLogin(){$('login').style.display='block';$('app').style.display='none'}function showApp(){$('login').style.display='none';$('app').style.display='block';$('who').textContent=(session && session.user && session.user.email||'')+' · التحديث يدوي فقط';}
async function submitLogin(){$('loginMsg').textContent='جاري الاتصال بـ Supabase...';$('loginBtn').disabled=true;try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('أدخل البريد الإلكتروني وكلمة المرور.');const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});const text=await r.text();let j={};try{j=JSON.parse(text)}catch(e){}if(!r.ok)throw Error(j.error_description||j.msg||j.message||('فشل تسجيل الدخول (HTTP '+r.status+')'));session={access_token:j.access_token,user:j.user||{email}};localStorage.setItem('aeriotv_admin_session',JSON.stringify(session));$('loginMsg').textContent='';showApp();loadAll()}catch(e){$('loginMsg').textContent=e.message||'فشل تسجيل الدخول'}finally{$('loginBtn').disabled=false}}
function logout(){localStorage.removeItem('aeriotv_admin_session');session=null;showLogin()}async function call(body){if(!session?.access_token)throw Error('انتهت الجلسة');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toLocal(x){if(!x)return '';const d=new Date(x),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}function statusLabel(d){if(d.status==='suspended')return 'موقوف';if(d.status==='expired'||(d.expires_at&&new Date(d.expires_at)<=new Date()))return 'منتهي';if(d.subscription_type==='trial')return 'تجربة';return 'نشط'}
function renderDevice(d){const v=d.video_config||{},a=d.audio_config||{},label=statusLabel(d),cls=d.status==='suspended'?'suspended':label==='منتهي'?'expired':'active';return `<div class="device"><div class="device-top"><div class="device-title"><div><span class="badge ${cls}">${esc(label)}</span><div class="device-id" style="margin-top:7px">${esc(d.device_id||d.mac_address||'-')}</div></div><div class="muted">${esc(d.subscription_type||'')}</div></div><div class="meta"><div class="meta-item"><span>آخر اتصال</span><b>${esc(toLocal(d.last_seen_at)||'لم يتصل بعد')}</b></div><div class="meta-item"><span>الانتهاء</span><b>${esc(toLocal(d.expires_at)||'-')}</b></div><div class="meta-item"><span>تاريخ التسجيل</span><b>${esc(toLocal(d.first_registered_at)||'-')}</b></div></div></div><div class="device-toggle"><details><summary>عرض التفاصيل والاشتراك</summary><div class="details-body"><div class="subbox"><h3>بيانات Xtream</h3><div class="field"><label>Host</label><input id="vhost-${d.id}" value="${esc(v.server_url)}"></div><div class="field"><label>Username</label><input id="vuser-${d.id}" value="${esc(v.username)}"></div><div class="field"><label>Password</label><input id="vpass-${d.id}" class="secret" type="password" value="${esc(v.password)}"></div><button class="secondary" style="margin-top:8px" onclick="togglePassword('vpass-${d.id}',this)">إظهار كلمة المرور</button></div><div class="actions"><button class="success" onclick="activateDevice('${d.id}',12,'${esc(d.video_profile_id||'')}','${esc(d.audio_profile_id||'')}')">تفعيل سنة — 80 ريال</button><button class="success" onclick="activateDevice('${d.id}',6,'${esc(d.video_profile_id||'')}','${esc(d.audio_profile_id||'')}')">تفعيل 6 أشهر — 50 ريال</button><button class="danger" onclick="setStatus('${d.id}','suspended','${esc(d.video_profile_id||'')}','${esc(d.audio_profile_id||'')}')">توقيف الجهاز</button><button class="danger" onclick="deleteDevice('${d.id}','${esc(d.device_id||d.mac_address||'الجهاز')}')">حذف نهائي</button></div><div class="subbox"><h3>تعديل الاشتراك</h3><div class="grid"><label>الحالة<select id="st-${d.id}"><option value="active" ${d.status==='active'?'selected':''}>نشط</option><option value="suspended" ${d.status==='suspended'?'selected':''}>موقوف</option><option value="expired" ${d.status==='expired'?'selected':''}>منتهي</option></select></label><label>تاريخ الانتهاء<input id="ex-${d.id}" type="datetime-local" value="${toLocal(d.expires_at)}"></label></div><button onclick="configureDevice('${d.id}')" style="margin-top:8px">حفظ بيانات الاشتراك</button></div><div class="subbox"><h3>الصوت — M3U <span class="muted">اختياري</span></h3><input id="am3u-${d.id}" placeholder="رابط M3U — اختياري" value="${esc(a.m3u_url)}"></div></div></details></div></div>`}
function togglePassword(id,btn){const e=$(id);e.type=e.type==='password'?'text':'password';btn.textContent=e.type==='password'?'إظهار كلمة المرور':'إخفاء كلمة المرور'}
async function rpc(name,args={}){
  if(!session?.access_token)throw Error('انتهت الجلسة');
  const r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify(args)});
  const text=await r.text();let j={};try{j=JSON.parse(text)}catch(e){}
  if(!r.ok)throw Error(j.message||j.error||'فشل تنفيذ العملية');
  return j;
}
async function deleteDevice(id,label){
  if(!confirm('تحذير: سيتم حذف الجهاز '+label+' نهائيًا من قاعدة البيانات. لا يمكن التراجع عن هذا الإجراء.\n\nهل تريد المتابعة؟'))return;
  try{const j=await rpc('admin_delete_device',{p_device_id:id});if(!j?.ok)throw Error(j?.error||'فشل حذف الجهاز');await loadAll()}catch(e){alert(e.message)}
}
async function deleteAllDevices(){
  const count=$('total').textContent||'0';
  if(count==='0'){alert('لا توجد أجهزة لحذفها.');return}
  if(!confirm('تحذير شديد: سيتم حذف جميع الأجهزة ('+count+') نهائيًا، مع تنظيف بيانات الاشتراكات المرتبطة بها. لا يمكن التراجع.\n\nهل تريد المتابعة؟'))return;
  if(prompt('للتأكيد اكتب: حذف الكل')!=='حذف الكل')return;
  try{const j=await rpc('admin_delete_all_devices',{});if(!j?.ok)throw Error(j?.error||'فشل حذف جميع الأجهزة');alert('تم حذف '+(j.deleted??count)+' جهاز نهائيًا.');await loadAll()}catch(e){alert(e.message)}
}
async function loadStats(){const j=await call({action:'stats'});['total','trials','active','expired','suspended'].forEach(k=>$(k).textContent=j[k]??0)}
async function loadDevices(page=0){currentPage=Math.max(0,page);$('results').innerHTML='<div class="muted">جاري تحميل الأجهزة...</div>';try{const j=await call({action:'list',filter:$('filter').value,sort:$('sort').value,page:currentPage,limit:PAGE_SIZE});totalRows=j.total||0;$('listInfo').textContent='عدد النتائج: '+totalRows;$('pageInfo').textContent='الصفحة '+(currentPage+1)+' من '+Math.max(1,Math.ceil(totalRows/PAGE_SIZE));$('prevBtn').disabled=currentPage===0;$('nextBtn').disabled=(currentPage+1)*PAGE_SIZE>=totalRows;$('results').innerHTML=j.devices.length?j.devices.map(renderDevice).join(''):'<div class="muted" style="margin-top:14px">لا توجد أجهزة في هذا التصنيف.</div>'}catch(e){$('results').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function changePage(delta){loadDevices(currentPage+delta)}
async function searchDevice(){const q=$('q').value.trim();if(!q){loadDevices(0);return}$('results').innerHTML='<div class="muted">جاري البحث...</div>';try{const j=await call({action:'search',query:q});totalRows=j.devices.length;$('listInfo').textContent='نتائج البحث: '+j.devices.length;$('pageInfo').textContent='نتائج البحث';$('prevBtn').disabled=true;$('nextBtn').disabled=true;$('results').innerHTML=j.devices.length?j.devices.map(renderDevice).join(''):'<div class="muted">لم يتم العثور على جهاز.</div>'}catch(e){$('results').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function setStatus(id,status,videoProfileId,audioProfileId){
  try{
    await call({action:'update',id,status,subscription_type:'paid',
      video_profile_id:videoProfileId||null,audio_profile_id:audioProfileId||null});
    await loadAll()
  }catch(e){alert(e.message)}
}
async function activateDevice(id,months,videoProfileId,audioProfileId){
  if(!confirm('تفعيل الجهاز لمدة '+(months===12?'سنة':'6 أشهر')+'؟'))return;
  try{
    await call({
      action:'update',id,status:'active',subscription_type:'paid',
      expires_at:new Date(Date.now()+months*30*24*60*60*1000).toISOString(),
      video_profile_id:videoProfileId||null,audio_profile_id:audioProfileId||null
    });
    await loadAll()
  }catch(e){alert(e.message)}
}
async function configureDevice(id){try{const ex=$('ex-'+id).value,body={action:'configure_device',device_id:id,status:$('st-'+id).value,expires_at:ex?new Date(ex).toISOString():null,video:{server_url:$('vhost-'+id).value.trim(),username:$('vuser-'+id).value.trim(),password:$('vpass-'+id).value},audio:{m3u_url:$('am3u-'+id).value.trim()}};const missing=[];if(!body.video.server_url)missing.push('Host');if(!body.video.username)missing.push('Username');if(!body.video.password)missing.push('Password');if(missing.length)throw Error('أكمل: '+missing.join('، '));await call(body);alert('تم حفظ بيانات الاشتراك.');await loadAll()}catch(e){alert(e.message)}}
async function loadAll(){try{await Promise.all([loadStats(),loadDevices(0)])}catch(e){$('results').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}let pullStartY=0,pulling=false,pullTriggered=false;
function initPullToRefresh(){
  document.addEventListener('touchstart',e=>{
    if(window.scrollY===0 && e.touches.length===1){pullStartY=e.touches[0].clientY;pulling=true;pullTriggered=false}
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling||e.touches.length!==1)return;
    const dy=e.touches[0].clientY-pullStartY;
    if(dy>70&&!pullTriggered&&session&&session.access_token){
      pullTriggered=true;
      loadAll();
    }
    if(dy<0)pulling=false;
  },{passive:true});
  document.addEventListener('touchend',()=>{pulling=false},{passive:true});
}
$('loginBtn').addEventListener('click',submitLogin);initPullToRefresh();boot();
</script></body></html>
