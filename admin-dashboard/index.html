<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AerioTV Control</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1020;color:#eef2ff;margin:0}
.wrap{max-width:950px;margin:30px auto;padding:20px}.card{background:#151c31;border:1px solid #27314f;border-radius:18px;padding:22px;margin-bottom:18px}
h1,h2,h3{margin-top:0}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #34405f;background:#0d1426;color:#fff;margin:6px 0}
button{cursor:pointer;background:#315efb;border:0;font-weight:700}button.secondary{background:#27314f}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.device{padding:18px;border:1px solid #2c3757;border-radius:14px;margin-top:12px}.muted{color:#aab4cf;font-size:13px}.error{color:#ff9b9b}.ok{color:#8de0aa}
.section{margin-top:18px;padding-top:18px;border-top:1px solid #27314f}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#27314f;font-size:12px}
.subbox{padding:16px;border:1px solid #2c3757;border-radius:14px;margin-top:14px}.subbox h3{margin-bottom:6px}
.notice{padding:12px;border-radius:10px;background:#0d1426;color:#aab4cf;font-size:13px;margin:10px 0}
@media(max-width:700px){.grid{grid-template-columns:1fr}.row{display:block}}
</style>
</head>
<body>
<div class="wrap">
<div class="card" id="login">
<h1>AerioTV Control</h1><p class="muted">لوحة إدارة الأجهزة</p>
<input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
<input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button id="loginBtn" type="button">تسجيل الدخول</button><div id="loginMsg" class="error"></div>
</div>

<div class="card" id="app" style="display:none">
<div class="row"><div><h1>إدارة الأجهزة</h1><div id="who" class="muted"></div></div><button class="secondary" onclick="logout()">تسجيل الخروج</button></div>

<div class="section">
<h2>البحث عن جهاز</h2>
<p class="muted">أدخل MAC Address أو Device ID. لن تظهر حقول الاشتراكات إلا بعد العثور على الجهاز.</p>
<input id="q" placeholder="الصق MAC Address أو Device ID هنا" autocomplete="off">
<button onclick="searchDevice()">بحث عن الجهاز</button>
<div id="results"></div>
</div>
</div>
</div>

<script>
const URL='https://quaftlmuobshbnlhctmf.supabase.co';
const KEY='sb_publishable_6mdnO-ezptIZzRKNfEbzaA_e9B-ulL5';
const API=URL+'/functions/v1/admin-control';
let session=null;
const $=id=>document.getElementById(id);
window.onerror=m=>$('loginMsg').textContent='خطأ في الصفحة: '+m;

async function boot(){
 try{
  const raw=localStorage.getItem('aeriotv_admin_session');
  if(raw){session=JSON.parse(raw);if(session?.access_token){showApp();return}}
  showLogin();
 }catch(e){localStorage.removeItem('aeriotv_admin_session');showLogin()}
}
function showLogin(){$('login').style.display='block';$('app').style.display='none'}
function showApp(){$('login').style.display='none';$('app').style.display='block';$('who').textContent=session?.user?.email||''}
async function login(){
 $('loginMsg').textContent='جاري الاتصال بـ Supabase...';$('loginBtn').disabled=true;
 try{
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password)throw Error('أدخل البريد الإلكتروني وكلمة المرور.');
  const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});
  const j=await r.json();
  if(!r.ok)throw Error(j.error_description||j.msg||j.message||'فشل تسجيل الدخول');
  if(!j.access_token)throw Error('لم يتم إنشاء جلسة تسجيل الدخول.');
  session={access_token:j.access_token,user:j.user||{email}};
  localStorage.setItem('aeriotv_admin_session',JSON.stringify(session));
  $('loginMsg').textContent='';showApp();
 }catch(e){$('loginMsg').textContent=e.message||'فشل تسجيل الدخول'}
 finally{$('loginBtn').disabled=false}
}
function logout(){localStorage.removeItem('aeriotv_admin_session');session=null;showLogin()}

async function call(body){
 if(!session?.access_token)throw Error('انتهت الجلسة');
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});
 const j=await r.json();
 if(!r.ok)throw Error(j.error||'حدث خطأ');
 return j;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toLocal(x){
 if(!x)return '';
 const d=new Date(x),p=n=>String(n).padStart(2,'0');
 return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function renderDevice(d){
 const status=d.status||'suspended';
 const v=d.video_config||{};
 const a=d.audio_config||{};
 return '<div class="device">'+
 '<div><span class="badge">الجهاز</span> <b>'+esc(d.mac_address)+'</b></div>'+
 '<div class="muted" style="margin-top:6px">Device ID: '+esc(d.id)+'</div>'+
 '<div class="notice">تم العثور على الجهاز. أدخل اشتراك الفيديو والصوت هنا، وسيتم ربطهما بهذا الجهاز مباشرة. لا توجد قائمة اشتراكات عامة.</div>'+
 '<div class="grid">'+
 '<label>الحالة<select id="st-'+d.id+'"><option value="active" '+(status==='active'?'selected':'')+'>فعال</option><option value="suspended" '+(status==='suspended'?'selected':'')+'>موقوف</option><option value="expired" '+(status==='expired'?'selected':'')+'>منتهي</option></select></label>'+
 '<label>تاريخ الانتهاء<input id="ex-'+d.id+'" type="datetime-local" value="'+toLocal(d.expires_at)+'"></label>'+
 '</div>'+
 '<div class="subbox"><h3>اشتراك الفيديو — Xtream</h3>'+
 '<p class="muted">هذه البيانات تخص هذا الجهاز فقط.</p>'+
 '<input id="vhost-'+d.id+'" placeholder="Host / Server URL" value="'+esc(v.server_url)+'">'+
 '<input id="vuser-'+d.id+'" placeholder="Username" value="'+esc(v.username)+'">'+
 '<input id="vpass-'+d.id+'" type="password" placeholder="Password" value="'+esc(v.password)+'">'+
 '</div>'+
 '<div class="subbox"><h3>اشتراك الصوت — M3U</h3>'+
 '<p class="muted">هذا الرابط سيُربط بهذا الجهاز مباشرة.</p>'+
 '<input id="am3u-'+d.id+'" placeholder="رابط M3U" value="'+esc(a.m3u_url)+'">'+
 '</div>'+
 '<button onclick="configureDevice(\''+d.id+'\')">حفظ وربط الاشتراكات بهذا الجهاز</button>'+
 '</div>';
}
async function searchDevice(){
 const q=$('q').value.trim();
 if(!q){$('results').innerHTML='<div class="error">أدخل MAC Address أو Device ID.</div>';return}
 $('results').innerHTML='<div class="muted">جاري البحث...</div>';
 try{
  const j=await call({action:'search',query:q});
  if(!j.devices.length){$('results').innerHTML='<div class="muted">لم يتم العثور على جهاز.</div>';return}
  $('results').innerHTML=j.devices.map(renderDevice).join('');
 }catch(e){$('results').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
async function configureDevice(id){
 try{
  const ex=$('ex-'+id).value;
  const body={
   action:'configure_device',
   device_id:id,
   status:$('st-'+id).value,
   expires_at:ex?new Date(ex).toISOString():null,
   video:{
    server_url:$('vhost-'+id).value.trim(),
    username:$('vuser-'+id).value.trim(),
    password:$('vpass-'+id).value
   },
   audio:{m3u_url:$('am3u-'+id).value.trim()}
  };
  const missing=[];
  if(!body.video.server_url)missing.push('Host');
  if(!body.video.username)missing.push('Username');
  if(!body.video.password)missing.push('Password');
  if(!body.audio.m3u_url)missing.push('رابط M3U');
  if(missing.length)throw Error('أكمل: '+missing.join('، '));
  await call(body);
  alert('تم حفظ الاشتراكات وربطها بالجهاز مباشرة.');
  await searchDevice();
 }catch(e){alert(e.message)}
}
$('loginBtn').addEventListener('click',login);
boot();
</script>
</body>
</html>
