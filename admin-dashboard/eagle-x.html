<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eagle X Control — اللوحة الجديدة</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101a2b;--line:#24344c;--muted:#93a4bb;--text:#edf4ff;--cyan:#45d5e8;--green:#35d49a;--amber:#f4bd62;--red:#ff7187}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#142b49 0,transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}.wrap{max-width:1240px;margin:auto;padding:28px 22px 56px}.card{background:linear-gradient(145deg,#111c2ef5,#0c1422fa);border:1px solid var(--line);border-radius:20px;padding:22px;margin:0 0 20px;box-shadow:0 12px 35px #0002}h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.02em}h1{font-size:25px}h2{font-size:20px}h3{font-size:15px;margin:12px 0 4px}.muted{color:var(--muted);font-size:12px}.err{color:var(--red)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}input,select,textarea,button{font:inherit;width:100%;padding:11px 13px;border-radius:11px;border:1px solid #2b3d56;background:#09111e;color:var(--text);margin:5px 0;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #45d5e81b}button{cursor:pointer;background:linear-gradient(135deg,var(--cyan),#74e3d1);color:#07121d;border:0;font-weight:750}button:hover{filter:brightness(1.07)}button:disabled{opacity:.6}button.secondary{background:#17253a;color:var(--text);border:1px solid #31445f}button.danger{background:#3a1c2a;color:#ffb4c0;border:1px solid #6a2b40}.topbar,.brand,.section-head,.item-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{justify-content:flex-start}.brand-mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#42d6e8,#6789ff);color:#06111e;font-size:21px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:22px}.stat{padding:16px;background:linear-gradient(145deg,#111f32,#0b1422);border:1px solid #24374e;border-radius:15px;min-width:0}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:28px;margin-top:6px;line-height:1.2}.section-head{margin-bottom:14px}.section-actions{display:flex;gap:8px}.section-actions button{width:auto;min-width:110px}.searchbar{display:flex;gap:10px;margin-bottom:15px}.searchbar input{margin:0;flex:1}.searchbar button{width:auto;min-width:130px}.device-list{display:grid;gap:10px}.item{border:1px solid #25364e;border-radius:15px;padding:16px;background:linear-gradient(120deg,#111d2e,#0c1523);margin:0;overflow-wrap:anywhere}.device-summary{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(90px,.55fr) minmax(110px,.9fr) minmax(110px,.9fr) auto;align-items:center;gap:14px}.device-id{font-size:13px;font-weight:750;overflow-wrap:anywhere}.device-name{font-size:13px;color:#dce7f7;margin-top:4px}.meta-label{font-size:11px;color:var(--muted);margin-bottom:3px}.meta-value{font-size:12px;color:#dce7f7}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:#19283d;border:1px solid #2a405b;padding:5px 10px;font-size:11px;white-space:nowrap}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.pill.active{color:var(--green);background:#103027;border-color:#1d5947}.pill.pending{color:var(--amber);background:#352a18;border-color:#5b4626}.pill.suspended,.pill.revoked,.pill.expired{color:#ff9bab;background:#351b29;border-color:#603044}.device-actions{display:flex;gap:7px;align-items:center}.device-actions button{width:auto;margin:0;padding:9px 12px;white-space:nowrap}.device-form{margin-top:15px;padding-top:14px;border-top:1px solid #26374d}.device-form summary,details>summary{cursor:pointer;color:#8fe6f0;font-weight:700;padding:5px 0;list-style:none}details>summary::-webkit-details-marker{display:none}details>summary:after{content:"＋";float:left;color:var(--cyan)}details[open]>summary:after{content:"−"}details.create-panel{background:#0b1422;border:1px dashed #31465f;border-radius:14px;padding:12px 15px;margin:14px 0}.empty{padding:32px 16px;text-align:center;border:1px dashed #2b3d56;border-radius:14px;color:var(--muted)}.empty-icon{font-size:26px;margin-bottom:8px}.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.login-card{max-width:430px;margin:7vh auto}.login-card>p{margin:7px 0 20px}.hidden{display:none}label.muted{display:block}textarea{min-height:70px;resize:vertical}.record-id{margin-top:10px;font-size:10px;color:#70829a;overflow-wrap:anywhere}
@media(max-width:850px){.wrap{padding:18px 13px 40px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.device-summary{grid-template-columns:minmax(0,1fr) auto;gap:10px}.device-summary .last-seen{grid-column:1/-1}.device-actions{grid-column:1/-1}.device-actions button{flex:1}.section-head{align-items:flex-start;flex-wrap:wrap}}
@media(max-width:520px){.wrap{padding:10px 9px 28px}.card{padding:14px;border-radius:16px;margin-bottom:13px}.topbar{align-items:flex-start}.brand-mark{width:38px;height:38px}.brand h1{font-size:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:17px}.stat{padding:12px}.stat b{font-size:23px}.stat:last-child{grid-column:span 2}.searchbar{flex-direction:column}.searchbar button{width:100%}.section-actions{width:100%}.section-actions button{flex:1}.item{padding:12px}.row>*{min-width:100%}.login-card{margin:4vh auto}}
</style></head><body><main class="wrap">
<section class="card login-card" id="login"><div class="brand login-logo"><div class="brand-mark">E</div><div><h1>Eagle X Control</h1><div class="muted">إدارة الأجهزة والاشتراكات</div></div></div><p class="muted">سجّل الدخول إلى لوحة التحكم.</p><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="loginBtn">تسجيل الدخول</button><p id="loginMsg" class="err"></p><a href="./index.html" style="color:#65dff3">العودة إلى لوحة المشروع القديم</a></section>
<div id="app" class="hidden">
<section class="card"><div class="topbar"><div class="brand"><div class="brand-mark">E</div><div><h1>Eagle X Control</h1><div id="who" class="muted"></div></div></div><button class="secondary" style="width:auto" onclick="logout()">تسجيل الخروج</button></div><div class="stats" id="stats"></div></section>
<section class="card"><div class="section-head"><h2>الأجهزة</h2><div class="section-actions"><button onclick="loadDevices()" class="secondary">↻ تحديث</button></div></div><div class="searchbar"><input id="deviceSearch" placeholder="بحث بمعرّف الجهاز أو الاسم"><button onclick="loadDevices()">تحديث القائمة</button></div><details class="create-panel"><summary>إضافة جهاز جديد</summary><div class="row"><input id="newIdentifier" placeholder="معرّف الجهاز الذي أرسله الزبون"></div><div class="row"><input id="newName" placeholder="اسم الجهاز (اختياري)"><select id="newStatus"><option value="pending">بانتظار التفعيل</option><option value="active">نشط</option><option value="suspended">موقوف</option></select></div><select id="newSubscription"><option value="">بدون اشتراك</option></select><textarea id="newNotes" placeholder="ملاحظات (اختياري)"></textarea><button onclick="createDevice()">إضافة الجهاز</button></details><div id="devices"></div></section>
<section class="card"><div class="section-head"><h2>الاشتراكات</h2><span class="muted">إدارة الخطط والحدود</span></div><details class="create-panel"><summary>إنشاء اشتراك جديد</summary><input id="planName" placeholder="اسم الاشتراك"><div class="row"><input id="planCode" placeholder="رمز الخطة" value="standard"><select id="planStatus"><option value="active">نشط</option><option value="paused">متوقف مؤقتًا</option><option value="expired">منتهي</option><option value="cancelled">ملغي</option></select></div><div class="row"><label class="muted">بداية الاشتراك<input id="planStart" type="datetime-local"></label><label class="muted">تاريخ الانتهاء<input id="planExpiry" type="datetime-local"></label><label class="muted">عدد الأجهزة<input id="planMax" type="number" min="1" max="100" value="1"></label></div><textarea id="planNotes" placeholder="ملاحظات (اختياري)"></textarea><button onclick="createSubscription()">إنشاء الاشتراك</button></details><div id="subscriptions"></div></section>
</div></main>
<script>
const URL='https://gyadzfbfxayifwrpevuq.supabase.co',KEY='sb_publishable_sOK57WGfBcTE75ArdZSmiQ_htG1tn-H',API=URL+'/functions/v1/admin-api';let session=null,devices=[],subscriptions=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t){$('loginMsg').textContent=t}function fmt(v){return v?new Date(v).toLocaleString('ar'): '—'}
async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!=='goldiptv71@gmail.com'){msg('هذا الحساب مخصص للوحة المشروع الجديد فقط.');return}if(!password){msg('أدخل كلمة المرور.');return}$('loginBtn').disabled=true;msg('جاري تسجيل الدخول...');try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||j.message||'تعذر تسجيل الدخول');session={access_token:j.access_token,refresh_token:j.refresh_token,user:j.user};localStorage.setItem('eaglex_admin_session',JSON.stringify(session));showApp();await loadAll()}catch(e){msg(e.message)}finally{$('loginBtn').disabled=false}}
async function api(resource,method='GET',body=null,id=''){if(!session?.access_token)throw Error('انتهت الجلسة، سجل الدخول مجددًا');const url=API+'/'+resource+(id?'/'+encodeURIComponent(id):'');const headers={'apikey':KEY,'Authorization':'Bearer '+session.access_token};if(body)headers['Content-Type']='application/json';const r=await fetch(url,{method,headers,...(body?{body:JSON.stringify(body)}:{})});const raw=await r.text();let j={};try{j=JSON.parse(raw)}catch{}if(!r.ok)throw Error(j.error||j.message||('فشل الطلب ('+r.status+')'));return j}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session?.user?.email||''}
function logout(){localStorage.removeItem('eaglex_admin_session');session=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function loadAll(){await loadSubscriptions();await loadDevices()}
async function loadDevices(){
 const box=$('devices');box.innerHTML='<p class="muted">جاري تحميل الأجهزة...</p>';
 try{
  const j=await api('devices');devices=j.data||[];
  const q=$('deviceSearch').value.trim().toLowerCase();
  const shown=devices.filter(d=>{const source=(d.iptv_sources||[])[0]||{};return !q||[d.device_identifier,d.device_name,d.status,source.username,source.host_url].some(x=>String(x||'').toLowerCase().includes(q))});
  const counts={total:devices.length,active:devices.filter(d=>d.status==='active').length,pending:devices.filter(d=>d.status==='pending').length,suspended:devices.filter(d=>['suspended','revoked'].includes(d.status)).length,expired:devices.filter(d=>d.status==='expired'||(d.expires_at&&new Date(d.expires_at)<new Date())).length};
  $('stats').innerHTML=Object.entries({'إجمالي الأجهزة':counts.total,'النشطة':counts.active,'بانتظار التفعيل':counts.pending,'الموقوفة':counts.suspended,'المنتهية':counts.expired}).map(([k,v])=>'<div class="stat"><span class="muted">'+k+'</span><b>'+v+'</b></div>').join('');
  $('newSubscription').innerHTML='<option value="">بدون اشتراك</option>'+subscriptions.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+' — '+esc(s.status)+'</option>').join('');
  box.innerHTML=shown.length?'<div class="device-list">'+shown.map(d=>{
   const source=(d.iptv_sources||[])[0]||{};
   const isM3u=source.source_type==='m3u';
   const sourceType='<option value="xtream" '+(!isM3u?'selected':'')+'>Xtream / Host + Username + Password</option><option value="m3u" '+(isM3u?'selected':'')+'>M3U URL</option>';
   const subscriptionOptions='<option value="">بدون اشتراك</option>'+subscriptions.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===d.subscription_id?'selected':'')+'>'+esc(s.name)+' — '+esc(s.status)+'</option>').join('');
   const id=esc(d.id);
   const statusLabel={active:'نشط',pending:'بانتظار التفعيل',suspended:'موقوف',revoked:'ملغي',expired:'منتهي'}[d.status]||d.status;
   const statusClass=['active','pending','suspended','revoked','expired'].includes(d.status)?d.status:'';
   return '<article class="item"><div class="device-summary"><div><div class="device-id">'+esc(d.device_identifier)+'</div><div class="device-name">'+esc(d.device_name||'بدون اسم')+'</div></div>'
    +'<div><div class="meta-label">الحالة</div><span class="pill '+statusClass+'">'+esc(statusLabel)+'</span></div>'
    +'<div class="last-seen"><div class="meta-label">آخر اتصال</div><div class="meta-value">'+fmt(d.last_seen_at)+'</div></div>'
    +'<div><div class="meta-label">تاريخ الانتهاء</div><div class="meta-value">'+fmt(d.expires_at)+'</div></div>'
    +'<div class="device-actions"><button class="secondary" onclick="toggleDeviceDetails(\\''+id+'\\')">التفاصيل والتعديل</button></div></div>'
    +'<details class="device-form" id="details-'+id+'"><summary>بيانات الجهاز والاشتراك</summary>'
    +'<div class="row"><select id="status-'+id+'"><option value="pending" '+(d.status==='pending'?'selected':'')+'>بانتظار التفعيل</option><option value="active" '+(d.status==='active'?'selected':'')+'>نشط</option><option value="suspended" '+(d.status==='suspended'?'selected':'')+'>موقوف</option><option value="revoked" '+(d.status==='revoked'?'selected':'')+'>ملغي نهائيًا</option><option value="expired" '+(d.status==='expired'?'selected':'')+'>منتهي</option></select>'
    +'<input id="expiry-'+id+'" type="datetime-local" value="'+(d.expires_at?new Date(new Date(d.expires_at).getTime()-new Date(d.expires_at).getTimezoneOffset()*60000).toISOString().slice(0,16):'')+'" aria-label="تاريخ الانتهاء"></div>'
    +'<div class="row"><input id="name-'+id+'" value="'+esc(d.device_name||'')+'" placeholder="اسم الجهاز"><select id="sub-'+id+'" aria-label="الاشتراك">'+subscriptionOptions+'</select></div>'
    +'<h3>بيانات IPTV</h3><div class="row"><select id="source-type-'+id+'" aria-label="نوع مصدر IPTV">'+sourceType+'</select><input id="host-'+id+'" value="'+esc(source.host_url||'')+'" placeholder="Host / Server URL"></div>'
    +'<div class="row"><input id="username-'+id+'" value="'+esc(source.username||'')+'" placeholder="Username"><input id="password-'+id+'" type="text" value="'+esc(source.password_secret||'')+'" placeholder="Password"></div>'
    +'<input id="m3u-'+id+'" value="'+esc(source.m3u_url_secret||'')+'" placeholder="M3U URL (يُستخدم عند اختيار M3U)">'
    +'<textarea id="notes-'+id+'" placeholder="ملاحظات">'+esc(d.notes||'')+'</textarea>'
    +'<div class="row"><button onclick="saveDevice(\\''+id+'\\')">حفظ التغييرات</button><button class="danger" onclick="deleteRecord(\\'devices\\',\\''+id+'\\')">حذف الجهاز</button></div>'
    +'<div class="record-id">معرّف السجل: '+id+'</div></details></article>';
  }).join('')+'</div>':'<div class="empty"><div class="empty-icon">▦</div><div>لا توجد أجهزة مطابقة للبحث</div></div>';
 }catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}
}
async function createDevice(){try{const body={device_identifier:$('newIdentifier').value.trim(),device_name:$('newName').value.trim()||null,status:$('newStatus').value,subscription_id:$('newSubscription').value||null,notes:$('newNotes').value.trim()||null};await api('devices','POST',body);$('newIdentifier').value='';$('newName').value='';$('newNotes').value='';await loadDevices();alert('تمت إضافة الجهاز.')}catch(e){alert(e.message)}}
function toggleDeviceDetails(id){const el=$('details-'+id);if(el)el.open=!el.open}\nasync function saveDevice(id){try{const expiry=$('expiry-'+id).value;const sourceType=$('source-type-'+id).value;await api('devices','PATCH',{status:$('status-'+id).value,device_name:$('name-'+id).value.trim()||null,notes:$('notes-'+id).value.trim()||null,subscription_id:$('sub-'+id).value||null,expires_at:expiry?new Date(expiry).toISOString():null,iptv_source:{source_type:sourceType,host_url:$('host-'+id).value.trim(),username:$('username-'+id).value.trim(),password:$('password-'+id).value,m3u_url:$('m3u-'+id).value.trim()}},id);await loadDevices();alert('تم حفظ الاشتراك وبيانات IPTV. اطلب من الزبون الضغط على تحديث.')}catch(e){alert(e.message)}}
async function loadSubscriptions(){const box=$('subscriptions');box.innerHTML='<p class="muted">جاري تحميل الاشتراكات...</p>';try{const j=await api('subscriptions');subscriptions=j.data||[];box.innerHTML=subscriptions.length?'<div class="subgrid">'+subscriptions.map(s=>'<div class="item"><div class="item-head"><b>'+esc(s.name)+'</b><span class="pill '+esc(s.status)+'">'+esc(s.status)+'</span></div><div class="muted">الخطة: '+esc(s.plan_code)+' · الأجهزة المسموحة: '+esc(s.max_devices)+' · الانتهاء: '+fmt(s.expires_at)+'</div><div class="row"><input id="sn-'+esc(s.id)+'" value="'+esc(s.name)+'" aria-label="اسم الاشتراك"><select id="ss-'+esc(s.id)+'"><option value="active" '+(s.status==='active'?'selected':'')+'>نشط</option><option value="paused" '+(s.status==='paused'?'selected':'')+'>متوقف مؤقتًا</option><option value="expired" '+(s.status==='expired'?'selected':'')+'>منتهي</option><option value="cancelled" '+(s.status==='cancelled'?'selected':'')+'>ملغي</option></select><input id="sm-'+esc(s.id)+'" type="number" min="1" max="100" value="'+esc(s.max_devices)+'" aria-label="عدد الأجهزة"></div><div class="row"><button onclick="saveSubscription(\''+esc(s.id)+'\')">حفظ الاشتراك</button><button class="danger" onclick="deleteRecord(\'subscriptions\',\''+esc(s.id)+'\')">حذف الاشتراك</button></div></div>').join(''):'<p class="muted">لا توجد اشتراكات.</p>';const sel=$('newSubscription');if(sel)sel.innerHTML='<option value="">بدون اشتراك</option>'+subscriptions.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+' — '+esc(s.status)+'</option>').join('')}catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function createSubscription(){try{const cv=id=>$(id).value?new Date($(id).value).toISOString():null;await api('subscriptions','POST',{name:$('planName').value.trim(),plan_code:$('planCode').value.trim()||'standard',status:$('planStatus').value,starts_at:cv('planStart'),expires_at:cv('planExpiry'),max_devices:Number($('planMax').value),notes:$('planNotes').value.trim()||null});$('planName').value='';await loadSubscriptions();alert('تم إنشاء الاشتراك.')}catch(e){alert(e.message)}}
async function saveSubscription(id){try{await api('subscriptions','PATCH',{name:$('sn-'+id).value.trim(),status:$('ss-'+id).value,max_devices:Number($('sm-'+id).value)},id);await loadSubscriptions();alert('تم حفظ الاشتراك.')}catch(e){alert(e.message)}}
async function deleteRecord(resource,id){if(!confirm('تأكيد حذف السجل؟ لا يمكن التراجع عن الحذف.'))return;try{await api(resource,'DELETE',null,id);await loadAll()}catch(e){alert(e.message)}}
$('loginBtn').addEventListener('click',login);$('deviceSearch').addEventListener('input',()=>{const q=$('deviceSearch').value.toLowerCase();document.querySelectorAll('#devices .item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')});
try{const raw=localStorage.getItem('eaglex_admin_session');if(raw){session=JSON.parse(raw);showApp();loadAll()}}catch(e){localStorage.removeItem('eaglex_admin_session')}
</script></body></html>
