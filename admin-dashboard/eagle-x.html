<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eagle X Control — اللوحة الجديدة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f4f7fb;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#0d1422;border:1px solid #20344b;border-radius:18px;padding:18px;margin:12px 0}h1,h2{margin:0 0 12px}.muted{color:#9ba9bc;font-size:13px}.err{color:#ff8295}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}input,select,textarea,button{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid #2b3c52;background:#080e18;color:#f4f7fb;margin:4px 0}button{cursor:pointer;background:#00c6e8;color:#031018;border:0;font-weight:750}button.secondary{background:#192638;color:#f4f7fb;border:1px solid #2b3c52}button.danger{background:#cf3d56;color:white}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{padding:14px;background:#09111e;border:1px solid #20344b;border-radius:12px}.stat b{display:block;font-size:24px;margin-top:5px}.item{border:1px solid #26374d;border-radius:12px;padding:12px;margin-top:10px;overflow-wrap:anywhere}.item-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{border-radius:99px;background:#192638;padding:4px 9px;font-size:12px}.hidden{display:none}@media(max-width:560px){.wrap{padding:9px}.card{padding:13px}}
</style></head><body><main class="wrap">
<section class="card" id="login"><h1>Eagle X Control</h1><p class="muted">لوحة المشروع الجديد — تسجيل الدخول بحساب المشروع الجديد فقط.</p><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="loginBtn">تسجيل الدخول</button><p id="loginMsg" class="err"></p><a href="./index.html" style="color:#65dff3">العودة إلى لوحة المشروع القديم</a></section>
<div id="app" class="hidden">
<section class="card"><div class="item-head"><div><h1>Eagle X Control</h1><div id="who" class="muted"></div></div><button class="secondary" style="width:auto" onclick="logout()">تسجيل الخروج</button></div><div class="stats" id="stats"></div></section>
<section class="card"><h2>الأجهزة</h2><div class="row"><input id="deviceSearch" placeholder="بحث بمعرّف الجهاز أو الاسم"><button onclick="loadDevices()">تحديث الأجهزة</button></div><details><summary>＋ إضافة جهاز</summary><div class="row"><input id="newIdentifier" placeholder="معرّف الجهاز"><input id="newCode" placeholder="رمز التفعيل (6 أحرف على الأقل)"></div><div class="row"><input id="newName" placeholder="اسم الجهاز (اختياري)"><select id="newStatus"><option value="pending">بانتظار التفعيل</option><option value="active">نشط</option><option value="suspended">موقوف</option></select></div><select id="newSubscription"><option value="">بدون اشتراك</option></select><textarea id="newNotes" placeholder="ملاحظات (اختياري)"></textarea><button onclick="createDevice()">إضافة الجهاز</button></details><div id="devices"></div></section>
<section class="card"><h2>الاشتراكات</h2><details><summary>＋ إنشاء اشتراك</summary><input id="planName" placeholder="اسم الاشتراك"><div class="row"><input id="planCode" placeholder="رمز الخطة" value="standard"><select id="planStatus"><option value="active">نشط</option><option value="paused">متوقف مؤقتًا</option><option value="expired">منتهي</option><option value="cancelled">ملغي</option></select></div><div class="row"><label class="muted">بداية الاشتراك<input id="planStart" type="datetime-local"></label><label class="muted">تاريخ الانتهاء<input id="planExpiry" type="datetime-local"></label><label class="muted">عدد الأجهزة<input id="planMax" type="number" min="1" max="100" value="1"></label></div><textarea id="planNotes" placeholder="ملاحظات (اختياري)"></textarea><button onclick="createSubscription()">إنشاء الاشتراك</button></details><div id="subscriptions"></div></section>
<section class="card"><h2>سجل العمليات</h2><button class="secondary" onclick="loadAudit()">تحديث سجل العمليات</button><div id="audit"></div></section>
</div></main>
<script>
const URL='https://gyadzfbfxayifwrpevuq.supabase.co',KEY='sb_publishable_sOK57WGfBcTE75ArdZSmiQ_htG1tn-H',API=URL+'/functions/v1/admin-api';let session=null,devices=[],subscriptions=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t){$('loginMsg').textContent=t}function fmt(v){return v?new Date(v).toLocaleString('ar'): '—'}
async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!=='goldiptv71@gmail.com'){msg('هذا الحساب مخصص للوحة المشروع الجديد فقط.');return}if(!password){msg('أدخل كلمة المرور.');return}$('loginBtn').disabled=true;msg('جاري تسجيل الدخول...');try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||j.message||'تعذر تسجيل الدخول');session={access_token:j.access_token,refresh_token:j.refresh_token,user:j.user};localStorage.setItem('eaglex_admin_session',JSON.stringify(session));showApp();await loadAll()}catch(e){msg(e.message)}finally{$('loginBtn').disabled=false}}
async function api(resource,method='GET',body=null,id=''){if(!session?.access_token)throw Error('انتهت الجلسة، سجل الدخول مجددًا');const url=API+'/'+resource+(id?'/'+encodeURIComponent(id):'');const headers={'apikey':KEY,'Authorization':'Bearer '+session.access_token};if(body)headers['Content-Type']='application/json';const r=await fetch(url,{method,headers,...(body?{body:JSON.stringify(body)}:{})});const raw=await r.text();let j={};try{j=JSON.parse(raw)}catch{}if(!r.ok)throw Error(j.error||j.message||('فشل الطلب ('+r.status+')'));return j}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session?.user?.email||''}
function logout(){localStorage.removeItem('eaglex_admin_session');session=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function loadAll(){await Promise.all([loadDevices(),loadSubscriptions(),loadAudit()])}
async function loadDevices(){const box=$('devices');box.innerHTML='<p class="muted">جاري تحميل الأجهزة...</p>';try{const j=await api('devices');devices=j.data||[];const q=$('deviceSearch').value.trim().toLowerCase();const shown=devices.filter(d=>!q||[d.device_identifier,d.device_name,d.status].some(x=>String(x||'').toLowerCase().includes(q)));const counts={total:devices.length,active:devices.filter(d=>d.status==='active').length,pending:devices.filter(d=>d.status==='pending').length,suspended:devices.filter(d=>['suspended','revoked'].includes(d.status)).length,expired:devices.filter(d=>d.status==='expired'||(d.expires_at&&new Date(d.expires_at)<new Date())).length};$('stats').innerHTML=Object.entries({ 'إجمالي الأجهزة':counts.total,'النشطة':counts.active,'بانتظار التفعيل':counts.pending,'الموقوفة':counts.suspended,'المنتهية':counts.expired}).map(([k,v])=>'<div class="stat"><span class="muted">'+k+'</span><b>'+v+'</b></div>').join('');$('newSubscription').innerHTML='<option value="">بدون اشتراك</option>'+subscriptions.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+' — '+esc(s.status)+'</option>').join('');box.innerHTML=shown.length?shown.map(d=>'<div class="item"><div class="item-head"><b>'+esc(d.device_identifier)+'</b><span class="pill">'+esc(d.status)+'</span></div><div class="muted">'+esc(d.device_name||'بدون اسم')+' · آخر اتصال: '+fmt(d.last_seen_at)+' · الانتهاء: '+fmt(d.expires_at)+'</div><div class="row"><select id="status-'+esc(d.id)+'"><option value="pending" '+(d.status==='pending'?'selected':'')+'>بانتظار التفعيل</option><option value="active" '+(d.status==='active'?'selected':'')+'>نشط</option><option value="suspended" '+(d.status==='suspended'?'selected':'')+'>موقوف</option><option value="revoked" '+(d.status==='revoked'?'selected':'')+'>ملغي نهائيًا</option><option value="expired" '+(d.status==='expired'?'selected':'')+'>منتهي</option></select><input id="expiry-'+esc(d.id)+'" type="datetime-local" value="'+(d.expires_at?new Date(new Date(d.expires_at).getTime()-new Date(d.expires_at).getTimezoneOffset()*60000).toISOString().slice(0,16):'')+'" aria-label="تاريخ الانتهاء"></div><input id="name-'+esc(d.id)+'" value="'+esc(d.device_name||'')+'" placeholder="اسم الجهاز"><textarea id="notes-'+esc(d.id)+'" placeholder="ملاحظات">'+esc(d.notes||'')+'</textarea><div class="row"><button onclick="saveDevice(\''+esc(d.id)+'\')">حفظ التعديلات</button><button class="danger" onclick="deleteRecord(\'devices\',\''+esc(d.id)+'\')">حذف الجهاز</button></div><div class="muted">معرّف السجل: '+esc(d.id)+'</div></div>').join(''):'<p class="muted">لا توجد أجهزة.</p>'}catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function createDevice(){try{const body={device_identifier:$('newIdentifier').value.trim(),activation_code:$('newCode').value.trim(),device_name:$('newName').value.trim()||null,status:$('newStatus').value,subscription_id:$('newSubscription').value||null,notes:$('newNotes').value.trim()||null};await api('devices','POST',body);$('newIdentifier').value='';$('newCode').value='';$('newName').value='';$('newNotes').value='';await loadDevices();alert('تمت إضافة الجهاز.')}catch(e){alert(e.message)}}
async function saveDevice(id){try{const expiry=$('expiry-'+id).value;await api('devices','PATCH',{status:$('status-'+id).value,device_name:$('name-'+id).value.trim()||null,notes:$('notes-'+id).value.trim()||null,expires_at:expiry?new Date(expiry).toISOString():null},id);await loadDevices();alert('تم حفظ الجهاز.')}catch(e){alert(e.message)}}
async function loadSubscriptions(){const box=$('subscriptions');box.innerHTML='<p class="muted">جاري تحميل الاشتراكات...</p>';try{const j=await api('subscriptions');subscriptions=j.data||[];box.innerHTML=subscriptions.length?subscriptions.map(s=>'<div class="item"><div class="item-head"><b>'+esc(s.name)+'</b><span class="pill">'+esc(s.status)+'</span></div><div class="muted">الخطة: '+esc(s.plan_code)+' · الأجهزة المسموحة: '+esc(s.max_devices)+' · الانتهاء: '+fmt(s.expires_at)+'</div><div class="row"><input id="sn-'+esc(s.id)+'" value="'+esc(s.name)+'" aria-label="اسم الاشتراك"><select id="ss-'+esc(s.id)+'"><option value="active" '+(s.status==='active'?'selected':'')+'>نشط</option><option value="paused" '+(s.status==='paused'?'selected':'')+'>متوقف مؤقتًا</option><option value="expired" '+(s.status==='expired'?'selected':'')+'>منتهي</option><option value="cancelled" '+(s.status==='cancelled'?'selected':'')+'>ملغي</option></select><input id="sm-'+esc(s.id)+'" type="number" min="1" max="100" value="'+esc(s.max_devices)+'" aria-label="عدد الأجهزة"></div><div class="row"><button onclick="saveSubscription(\''+esc(s.id)+'\')">حفظ الاشتراك</button><button class="danger" onclick="deleteRecord(\'subscriptions\',\''+esc(s.id)+'\')">حذف الاشتراك</button></div></div>').join(''):'<p class="muted">لا توجد اشتراكات.</p>';const sel=$('newSubscription');if(sel)sel.innerHTML='<option value="">بدون اشتراك</option>'+subscriptions.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+' — '+esc(s.status)+'</option>').join('')}catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function createSubscription(){try{const cv=id=>$(id).value?new Date($(id).value).toISOString():null;await api('subscriptions','POST',{name:$('planName').value.trim(),plan_code:$('planCode').value.trim()||'standard',status:$('planStatus').value,starts_at:cv('planStart'),expires_at:cv('planExpiry'),max_devices:Number($('planMax').value),notes:$('planNotes').value.trim()||null});$('planName').value='';await loadSubscriptions();alert('تم إنشاء الاشتراك.')}catch(e){alert(e.message)}}
async function saveSubscription(id){try{await api('subscriptions','PATCH',{name:$('sn-'+id).value.trim(),status:$('ss-'+id).value,max_devices:Number($('sm-'+id).value)},id);await loadSubscriptions();alert('تم حفظ الاشتراك.')}catch(e){alert(e.message)}}
async function deleteRecord(resource,id){if(!confirm('تأكيد حذف السجل؟ لا يمكن التراجع عن الحذف.'))return;try{await api(resource,'DELETE',null,id);await loadAll()}catch(e){alert(e.message)}}
async function loadAudit(){const box=$('audit');box.innerHTML='<p class="muted">جاري تحميل السجل...</p>';try{const j=await api('audit-logs');const rows=j.data||[];box.innerHTML=rows.length?rows.map(a=>'<div class="item"><b>'+esc(a.action)+' · '+esc(a.entity_type)+'</b><div class="muted">'+fmt(a.created_at)+' · '+esc(a.actor||'')+' · '+esc(a.entity_id||'')+'</div><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(a.details||{},null,2))+'</pre></div>').join(''):'<p class="muted">لا توجد عمليات مسجلة.</p>'}catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
$('loginBtn').addEventListener('click',login);$('deviceSearch').addEventListener('input',()=>{const q=$('deviceSearch').value.toLowerCase();document.querySelectorAll('#devices .item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')});
try{const raw=localStorage.getItem('eaglex_admin_session');if(raw){session=JSON.parse(raw);showApp();loadAll()}}catch(e){localStorage.removeItem('eaglex_admin_session')}
</script></body></html>
